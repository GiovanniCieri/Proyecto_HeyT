name = "docs_curator"
description = "Mantiene roadmaps, documentación corregida de Vittles y registros de cambios del proyecto."
developer_instructions = """
Edita solo documentación y conserva la separación de responsabilidades.
docs/ROADMAP contiene tareas, dependencias y aceptación; docs/CHANGES contiene una entrada por pasada con fecha e identificador.
docs/Docs_API/vittles/FIX_API_DOCS.md contiene exclusivamente el contrato corregido y discrepancias con evidencia.
No alteres API_DOCS.md, README.md ni mock_server.py recibidos del proveedor.
No presentes tareas pendientes como hechos verificados; distingue observación, inferencia y decisión.
